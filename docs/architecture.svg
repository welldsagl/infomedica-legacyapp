<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" role="img" aria-label="LegacyApp module architecture: five frontends on the left reach the REST API over HTTP; WinForms and Blazor share the VB client library; the API uses the Data layer, which hides Access or SQL Server behind EF Core." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="1180" height="560" fill="#ffffff"/>

  <!-- title -->
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1f2328">LegacyApp – moduli e dipendenze</text>
  <text x="24" y="54" fill="#6b7280">Tutto a sinistra della linea HTTP è sostituibile senza toccare API e Data.</text>

  <!-- HTTP boundary -->
  <line x1="700" y1="80" x2="700" y2="500" stroke="#cf222e" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="700" y="520" text-anchor="middle" fill="#cf222e" font-weight="600">confine HTTP / REST (JSON, OpenAPI)</text>
  <text x="520" y="92" text-anchor="middle" fill="#6b7280" font-size="12">FRONTEND (client dell'API)</text>
  <text x="900" y="92" text-anchor="middle" fill="#6b7280" font-size="12">BACKEND (sistema di riferimento)</text>

  <!-- ===== Frontends column ===== -->
  <!-- WinForms -->
  <rect x="40" y="120" width="190" height="56" rx="6" fill="#dbeafe" stroke="#1f2328"/>
  <text x="135" y="143" text-anchor="middle" font-weight="600" fill="#1f2328">LegacyApp.WinForms</text>
  <text x="135" y="162" text-anchor="middle" fill="#1f2328" font-size="12">desktop · VB · Windows</text>

  <!-- Blazor Server -->
  <rect x="40" y="206" width="190" height="56" rx="6" fill="#ede9fe" stroke="#1f2328"/>
  <text x="135" y="229" text-anchor="middle" font-weight="600" fill="#1f2328">LegacyApp.Blazor.Server</text>
  <text x="135" y="248" text-anchor="middle" fill="#1f2328" font-size="12">host · C# · UI sul server (SignalR)</text>

  <!-- Blazor Wasm -->
  <rect x="40" y="282" width="190" height="56" rx="6" fill="#ede9fe" stroke="#1f2328"/>
  <text x="135" y="305" text-anchor="middle" font-weight="600" fill="#1f2328">LegacyApp.Blazor.Wasm</text>
  <text x="135" y="324" text-anchor="middle" fill="#1f2328" font-size="12">host · C# · UI nel browser</text>

  <!-- Blazor Shared -->
  <rect x="280" y="244" width="190" height="56" rx="6" fill="#ede9fe" stroke="#1f2328"/>
  <text x="375" y="267" text-anchor="middle" font-weight="600" fill="#1f2328">LegacyApp.Blazor.Shared</text>
  <text x="375" y="286" text-anchor="middle" fill="#1f2328" font-size="12">pagine e componenti · C# (Razor)</text>

  <!-- React -->
  <rect x="40" y="400" width="190" height="56" rx="6" fill="#fef3c7" stroke="#1f2328"/>
  <text x="135" y="423" text-anchor="middle" font-weight="600" fill="#1f2328">clients/web</text>
  <text x="135" y="442" text-anchor="middle" fill="#1f2328" font-size="12">SPA · React + TypeScript</text>

  <!-- Client -->
  <rect x="520" y="200" width="150" height="80" rx="6" fill="#dbeafe" stroke="#1f2328"/>
  <text x="595" y="226" text-anchor="middle" font-weight="600" fill="#1f2328">LegacyApp.Client</text>
  <text x="595" y="245" text-anchor="middle" fill="#1f2328" font-size="12">client tipizzato · VB</text>
  <text x="595" y="262" text-anchor="middle" fill="#1f2328" font-size="12">DTO · ApiException · validator</text>

  <!-- arrows frontends -> client / shared -->
  <line x1="230" y1="148" x2="520" y2="226" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="176" fill="#1f2328" font-size="12" transform="rotate(15 370 176)">usa</text>

  <line x1="230" y1="234" x2="280" y2="262" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="310" x2="280" y2="282" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="246" y="275" fill="#1f2328" font-size="12">ospita</text>

  <line x1="470" y1="272" x2="520" y2="250" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="495" y="248" fill="#1f2328" font-size="12">usa</text>

  <!-- HTTP arrows -->
  <line x1="670" y1="240" x2="760" y2="240" stroke="#cf222e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="715" y="232" text-anchor="middle" fill="#cf222e" font-size="12">HTTP</text>

  <path d="M230,428 L740,428 L740,276 L760,276" fill="none" stroke="#cf222e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="485" y="420" text-anchor="middle" fill="#cf222e" font-size="12">HTTP (fetch, client TypeScript proprio)</text>

  <!-- ===== Backend ===== -->
  <!-- Api -->
  <rect x="760" y="200" width="170" height="90" rx="6" fill="#dbeafe" stroke="#1f2328"/>
  <text x="845" y="226" text-anchor="middle" font-weight="600" fill="#1f2328">LegacyApp.Api</text>
  <text x="845" y="245" text-anchor="middle" fill="#1f2328" font-size="12">ASP.NET Core REST · VB</text>
  <text x="845" y="262" text-anchor="middle" fill="#1f2328" font-size="12">controller · DTO · OpenAPI</text>
  <text x="845" y="279" text-anchor="middle" fill="#1f2328" font-size="12">CORS · ProblemDetails</text>

  <!-- Data -->
  <rect x="980" y="200" width="170" height="90" rx="6" fill="#dbeafe" stroke="#1f2328"/>
  <text x="1065" y="226" text-anchor="middle" font-weight="600" fill="#1f2328">LegacyApp.Data</text>
  <text x="1065" y="245" text-anchor="middle" fill="#1f2328" font-size="12">EF Core 10 · VB</text>
  <text x="1065" y="262" text-anchor="middle" fill="#1f2328" font-size="12">entità · DbContext</text>
  <text x="1065" y="279" text-anchor="middle" fill="#1f2328" font-size="12">mappature tabelle legacy</text>

  <line x1="930" y1="245" x2="980" y2="245" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="955" y="238" text-anchor="middle" fill="#1f2328" font-size="12">usa</text>

  <!-- Databases -->
  <rect x="980" y="360" width="80" height="70" rx="6" fill="#f6f8fa" stroke="#1f2328"/>
  <text x="1020" y="390" text-anchor="middle" font-weight="600" fill="#1f2328" font-size="12">Access</text>
  <text x="1020" y="408" text-anchor="middle" fill="#6b7280" font-size="11">Jet · oggi</text>

  <rect x="1070" y="360" width="80" height="70" rx="6" fill="#f6f8fa" stroke="#1f2328"/>
  <text x="1110" y="390" text-anchor="middle" font-weight="600" fill="#1f2328" font-size="12">SQL Server</text>
  <text x="1110" y="408" text-anchor="middle" fill="#6b7280" font-size="11">target cloud</text>

  <line x1="1040" y1="290" x2="1020" y2="360" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1090" y1="290" x2="1110" y2="360" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1065" y="335" text-anchor="middle" fill="#1f2328" font-size="12">provider da config</text>
  <text x="1065" y="350" text-anchor="middle" fill="#6b7280" font-size="11">(uno solo attivo)</text>

  <!-- legend -->
  <rect x="760" y="440" width="14" height="14" fill="#dbeafe" stroke="#1f2328"/>
  <text x="782" y="452" fill="#1f2328" font-size="12">VB.NET</text>
  <rect x="840" y="440" width="14" height="14" fill="#ede9fe" stroke="#1f2328"/>
  <text x="862" y="452" fill="#1f2328" font-size="12">C# (solo UI Blazor)</text>
  <rect x="990" y="440" width="14" height="14" fill="#fef3c7" stroke="#1f2328"/>
  <text x="1012" y="452" fill="#1f2328" font-size="12">TypeScript</text>
  <line x1="760" y1="476" x2="800" y2="476" stroke="#1f2328" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="808" y="480" fill="#1f2328" font-size="12">riferimento di progetto (compile-time)</text>
  <line x1="760" y1="498" x2="800" y2="498" stroke="#cf222e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="808" y="502" fill="#1f2328" font-size="12">chiamata HTTP (runtime)</text>
</svg>
