name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-linux:
    name: .NET (API + Blazor) on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: |
          dotnet restore src/LegacyApp.Api
          dotnet restore src/LegacyApp.Blazor.Wasm
          dotnet restore src/LegacyApp.Blazor.Server
      - name: Build
        run: |
          dotnet build src/LegacyApp.Api           -c Release --no-restore
          dotnet build src/LegacyApp.Blazor.Wasm   -c Release --no-restore
          dotnet build src/LegacyApp.Blazor.Server -c Release --no-restore
      - name: Publish WebAssembly (trimmed) and report size
        run: |
          dotnet publish src/LegacyApp.Blazor.Wasm -c Release --no-restore -o artifacts/wasm
          echo "### Blazor WebAssembly publish size" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh artifacts/wasm/wwwroot/_framework | tee -a "$GITHUB_STEP_SUMMARY"
          du -ch artifacts/wasm/wwwroot/_framework/*.br | tail -1 | sed 's/total/compressed (.br)/' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  dotnet-windows:
    name: .NET full solution on Windows (incl. WinForms)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build solution
        run: dotnet build LegacyApp.slnx -c Release

  web:
    name: React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  docker:
    name: Docker images build (same Dockerfiles Railway uses)
    runs-on: ubuntu-latest
    needs: [dotnet-linux]
    strategy:
      matrix:
        service: [LegacyApp.Api, LegacyApp.Blazor.Wasm, LegacyApp.Blazor.Server]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
